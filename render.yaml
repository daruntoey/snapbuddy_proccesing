services:
  # Backend API Service
  - type: web
    name: snapbuddy-backend
    env: python
    region: oregon
    plan: starter
    buildCommand: |
      cd backend
      pip install --upgrade pip
      pip install -r requirements.txt
    startCommand: |
      cd backend
      uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: snapbuddy-db
          property: connectionString
      - key: QDRANT_URL
        fromService:
          type: pserv
          name: snapbuddy-qdrant
          property: hostport
      - key: REDIS_URL
        fromService:
          type: redis
          name: snapbuddy-redis
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_CLOUD_PROJECT
        sync: false
      - key: GCS_BUCKET_NAME
        sync: false
      - key: GOOGLE_APPLICATION_CREDENTIALS_JSON
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 30
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: https://snapbuddy.onrender.com

  # Frontend Service
  - type: web
    name: snapbuddy-frontend
    env: node
    region: oregon
    plan: starter
    buildCommand: |
      cd frontend
      npm install
      npm run build
    startCommand: |
      cd frontend
      npm start
    envVars:
      - key: NODE_VERSION
        value: 18.17.0
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: snapbuddy-backend
          property: host
      - key: NEXT_PUBLIC_GOOGLE_MAPS_API_KEY
        sync: false

  # Qdrant Vector Database (Private Service)
  - type: pserv
    name: snapbuddy-qdrant
    env: docker
    region: oregon
    plan: starter
    dockerfilePath: ./infrastructure/qdrant.Dockerfile
    disk:
      name: qdrant-data
      mountPath: /qdrant/storage
      sizeGB: 10

  # Redis Cache
  - type: redis
    name: snapbuddy-redis
    region: oregon
    plan: starter
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

databases:
  # PostgreSQL with pgvector
  - name: snapbuddy-db
    databaseName: snapbuddy
    user: snapbuddy
    region: oregon
    plan: free
    postgresMajorVersion: 15
